# Compound prescriptions — one gameplan line that should expand into N Hevy exercises.
compound:
  "Plank + Pallof Press":
    - "Plank"
    - "Pallof Press"
  "Plank + Side Plank":
    - "Plank"
    - "Side Plank"

# Aliases — alternate names the agent might send. Resolved before lookup.
aliases:
  "RDL":                          "Romanian Deadlift"
  "DB Row":                       "One-Arm DB Row"
  "DB Press":                     "DB Overhead Press"
  "DB Shoulder Press":            "Seated DB Shoulder Press"
  "Goblet Squat (DB)":            "Goblet Squat"
  "Bench Press":                  "Flat Barbell Bench"
  "Barbell Bench":                "Flat Barbell Bench"
  "Pull-up (weighted if BW <8 RPE)": "Pull-up"
  "Back Squat OR Hack Squat":     "Back Squat"
  "Trap Bar Deadlift OR Goblet Squat": "Trap Bar Deadlift"

# Re-seed query (run when Hevy adds new stock exercises to your catalog):
#
#   SELECT exercise_template_id, title, primary_muscle_group, equipment
#   FROM `your-gcp-project.life_ops.raw_hevy_exercise_template`
#   WHERE subject_id = 1
#   ORDER BY title;
