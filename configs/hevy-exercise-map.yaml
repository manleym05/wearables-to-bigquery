# Cornerstone — Hevy exercise mapping
#
# Maps gameplan exercise names (as used in your own training plan)
# to Hevy `exercise_template_id`s. Read by `workers/hevy-push` at routine build time.
#
# IDs come from `life_ops.raw_hevy_exercise_template` (Hevy's stock catalog, 433 rows,
# ingested by `workers/hevy`). Re-seed with the query at the bottom of this file if
# Hevy adds new stock exercises.
#
# Conventions:
#   * Match the EXACT gameplan name (case-sensitive). The Worker also does case-insensitive
#     fallback and a small alias table (`aliases:` below).
#   * If a gameplan name is a COMPOUND ("Plank + Pallof Press"), list both Hevy IDs under
#     `compound:`. The Worker unpacks into two consecutive Hevy exercises with the same
#     set/rep prescription.
#   * Unknown names: the Worker FAILS LOUDLY (HTTP 422 + audit row with status="validation_failed").
#     Better friction than a wrong routine.
#
# Last seeded: 2026-05-26 against raw_hevy_exercise_template (433 stock + custom).

# ── Day 1: Upper (Hypertrophy) ────────────────────────────────────────────────
exercises:
  "Incline DB Press":            "07B38369"   # Incline Bench Press (Dumbbell)
  "Pull-up":                     "1B2B1E7C"   # Pull Up
  "Pull-up (weighted)":          "729237D1"   # Pull Up (Weighted)
